name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/package-lock.json
      # Resolve the Husky package even though this package lives in src.
      - run: npm install --ignore-scripts
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Publish unit test report
        if: ${{ !cancelled() && hashFiles('src/test-results/unit.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests
          path: src/test-results/unit.xml
          reporter: java-junit
      - name: Production build
        run: npm run build
      - name: End-to-end tests
        run: npm run e2e
      - name: Publish E2E test report
        if: ${{ !cancelled() && hashFiles('src/test-results/e2e.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Playwright E2E tests
          path: src/test-results/e2e.xml
          reporter: java-junit
      - name: Upload test reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            src/test-results/**/*.xml
            src/playwright-report/
          if-no-files-found: warn
      - name: Dependency audit
        run: npm audit --audit-level=high
